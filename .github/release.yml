changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Security & Policy Rules
      labels:
        - security
    - title: Features
      labels:
        - enhancement
        - feat
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies & CI
      labels:
        - dependencies
        - github-actions
    - title: Other Changes
      labels:
        - "*"
