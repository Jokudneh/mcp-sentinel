<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="mcp-sentinel — Stdio Firewall and Flight Recorder for Model Context Protocol (MCP)">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#475569" opacity="0.35" />
    </pattern>
  </defs>

  <!-- Outer frame -->
  <rect x="1.5" y="1.5" width="897" height="237" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="2" />
  <rect x="3" y="3" width="894" height="234" rx="15" fill="url(#dots)" />

  <!-- Top accent bar -->
  <rect x="36" y="1.5" width="180" height="3.5" rx="1.75" fill="url(#accent)" />

  <!-- Prominent Brand Logo (112x112) -->
  <g transform="translate(36, 64)">
    <rect x="0" y="0" width="112" height="112" rx="22" fill="#020617" stroke="#334155" stroke-width="2" />
    <path d="M56 17 L90 29 V57 C90 78 75 91.5 56 97.5 C37 91.5 22 78 22 57 V29 Z"
          fill="url(#shieldFill)" stroke="url(#accent)" stroke-width="3.6" stroke-linejoin="round" />
    <path d="M39 48 L51.5 57 L39 66" fill="none" stroke="#FFFFFF" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="57" y1="66" x2="73" y2="66" stroke="#34D399" stroke-width="4.4" stroke-linecap="round" />
  </g>

  <!-- Crisp High-Contrast Title Block -->
  <text x="172" y="106" fill="#FFFFFF"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="38" font-weight="800" letter-spacing="-0.6">mcp-sentinel</text>

  <!-- Version Pill with clean breathing room -->
  <g transform="translate(428, 80)">
    <rect x="0" y="0" width="64" height="27" rx="13.5" fill="#10B981" fill-opacity="0.18" stroke="#34D399" stroke-width="1.5" />
    <text x="32" y="18" text-anchor="middle" fill="#6EE7B7"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="13.5" font-weight="700">v0.2.0</text>
  </g>

  <!-- High-Contrast Readable Subtitle -->
  <text x="172" y="142" fill="#F1F5F9"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18.5" font-weight="600">Stdio Firewall &amp; Flight Recorder</text>
  <text x="172" y="169" fill="#CBD5E1"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="400">for Model Context Protocol (MCP)</text>

  <!-- Crisp Large-Text Terminal Telemetry Card -->
  <g transform="translate(524, 34)">
    <rect x="0" y="0" width="340" height="172" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5" />
    <!-- Window bar -->
    <path d="M1 12 C1 6 6 1 12 1 H328 C334 1 339 6 339 12 V36 H1 Z" fill="#1E293B" />
    <line x1="1" y1="36" x2="339" y2="36" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="18.5" r="4.5" fill="#EF4444" opacity="0.85" />
    <circle cx="34" cy="18.5" r="4.5" fill="#F59E0B" opacity="0.85" />
    <circle cx="50" cy="18.5" r="4.5" fill="#10B981" opacity="0.85" />
    <text x="324" y="23" text-anchor="end" fill="#CBD5E1"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="13" font-weight="600">enforce · 0 deps</text>

    <!-- Row 1: ALLOW -->
    <rect x="16" y="52" width="62" height="24" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="1" />
    <text x="47" y="68.5" text-anchor="middle" fill="#6EE7B7"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="13" font-weight="700">ALLOW</text>
    <text x="90" y="69" fill="#F8FAFC"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="14.5" font-weight="600">-&gt; echo</text>
    <text x="324" y="69" text-anchor="end" fill="#CBD5E1"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="13.5" font-weight="600">0.9µs</text>

    <!-- Row 2: BLOCK outbound -->
    <rect x="16" y="90" width="62" height="24" rx="5" fill="#7F1D1D" stroke="#EF4444" stroke-width="1" />
    <text x="47" y="106.5" text-anchor="middle" fill="#FCA5A5"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="13" font-weight="700">BLOCK</text>
    <text x="90" y="107" fill="#F8FAFC"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="14.5" font-weight="600">-&gt; run_shell</text>
    <text x="324" y="107" text-anchor="end" fill="#F87171"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="13.5" font-weight="700">exec.rm_rf</text>

    <!-- Row 3: BLOCK inbound -->
    <rect x="16" y="128" width="62" height="24" rx="5" fill="#78350F" stroke="#F59E0B" stroke-width="1" />
    <text x="47" y="144.5" text-anchor="middle" fill="#FDE68A"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="13" font-weight="700">BLOCK</text>
    <text x="90" y="145" fill="#F8FAFC"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="14.5" font-weight="600">&lt;- read_doc</text>
    <text x="324" y="145" text-anchor="end" fill="#FBBF24"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="13.5" font-weight="700">injection</text>
  </g>
</svg>
